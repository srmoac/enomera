<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F0F4FE">
<title>Página não encontrada | Enomera</title>
<link rel="icon" type="image/svg+xml" href="/assets/brand.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/motion-tokens.css">
<style>
  :root { --ink: #1C2240; --muted: #56607F; --accent: #3B4FB8; --bg: #F0F4FE; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px 16px; background: radial-gradient(120% 80% at 80% 0%, #DCE6FD 0%, var(--bg) 55%); color: var(--ink); font: 500 16px/1.5 Manrope, system-ui, sans-serif; }
  main { width: min(440px, 100%); padding: 32px 28px 28px; border-radius: 28px; background: linear-gradient(135deg, rgb(247 249 255 / .86), rgb(247 249 255 / .7)); -webkit-backdrop-filter: blur(22px) saturate(1.8); backdrop-filter: blur(22px) saturate(1.8); border: 1px solid rgb(255 255 255 / .6); box-shadow: inset 0 1px 0 rgb(255 255 255 / .7), 0 18px 48px -16px rgb(54 76 140 / .3); animation: in var(--eno-t-route, 420ms) var(--eno-ease-out, cubic-bezier(.23,1,.32,1)) both; }
  .brand { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; font-weight: 600; font-size: 18px; min-height: 44px; }
  h1 { margin: 20px 0 8px; font-size: clamp(28px, 7vw, 34px); line-height: 1.12; letter-spacing: -.02em; font-weight: 600; }
  p { margin: 0; color: var(--muted); }
  .actions { display: grid; gap: 8px; margin-top: 24px; }
  .btn { display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 16px; font-weight: 600; text-decoration: none; transition: transform var(--eno-t-press, 120ms) var(--eno-ease-out, cubic-bezier(.23,1,.32,1)); }
  .btn:active { transform: scale(var(--eno-press-scale, .98)); }
  .btn-main { background: var(--accent); color: #fff; }
  .btn-alt { color: var(--ink); background: rgb(255 255 255 / .6); border: 1px solid rgb(54 76 140 / .16); }
  .btn:focus-visible, .brand:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @keyframes in { from { opacity: 0; transform: translateY(12px) scale(.98); } }
  @media (prefers-reduced-motion: reduce) { main { animation-name: fade; } @keyframes fade { from { opacity: 0; } } .btn { transition: none; } }
</style>
</head>
<body>
<main>
  <a class="brand" href="/" translate="no"><img src="/assets/brand.svg" width="28" height="24" alt="">enomera</a>
  <h1>Esta página não existe.</h1>
  <p>O endereço pode ter mudado ou estar com algum erro de digitação.</p>
  <div class="actions">
    <a class="btn btn-main" href="/">Ir para o início</a>
    <a class="btn btn-alt" href="/portal">Acessar painel</a>
  </div>
</main>
<script src="/piloto/uso.js" data-produto="enomera" defer></script>
</body>
</html>
