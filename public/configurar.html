<!doctype html>
<html lang="pt-BR" data-theme="light">
<head><script src="/eno-perf.js"></script>
<meta charset="UTF-8"><meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F0F4FE">
<title>Configurar | Enomera</title>
<link rel="icon" type="image/svg+xml" href="/assets/brand.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/motion-tokens.css">
<link rel="stylesheet" href="/piloto/piloto.css">
<link rel="stylesheet" href="/eno-glass-ui.css">
<link rel="stylesheet" href="/eno-feedback.css">
<link rel="stylesheet" href="/eno-calendar.css">
<link rel="stylesheet" href="/eno-slide.css">
<script src="/eno-feedback.js"></script>
<script src="/eno-calendar.js"></script>
<script src="/eno-slide.js"></script>
<link rel="stylesheet" href="/eno-gestures.css">
<script src="/eno-gestures.js" defer></script>
<style>
  /* Mesma passagem da home/portal (ux-polish.css): sem a adesão dos dois lados o navegador aborta a
     transição vinda do portal ou do checkout e registra erro. */
  @view-transition { navigation: auto; }
  ::view-transition-old(root) { animation: cfgPageOut 160ms var(--eno-ease-out) both; }
  ::view-transition-new(root) { animation: none; }
  @keyframes cfgPageOut { to { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { ::view-transition-old(root) { animation: none; } }
  :root { --eno-toast-offset: 90px; }
  body { --c1: #b8c4ff; --c2: #ffd3c2; --c3: #dfe6ff; background: #f4f6fd; }
  body[data-produto="ambo"] { --c1: #a9d3fb; --c2: #cfe9ff; --c3: #e3f1ff; }
  body[data-produto="minne"] { --c1: #a8e3d8; --c2: #cdeee6; --c3: #e5f6f2; }
  body[data-produto="etha"] { --c1: #cbbcff; --c2: #ffd6ec; --c3: #ece6ff; }
  .cf-bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .cf-bg i { position: absolute; border-radius: 50%; filter: blur(60px); transition: background-color 420ms linear; }
  .cf-bg i:nth-child(1) { width: 60vmax; height: 60vmax; left: -18vmax; top: -22vmax; background: var(--c1); opacity: .7; }
  .cf-bg i:nth-child(2) { width: 46vmax; height: 46vmax; right: -14vmax; top: 24vh; background: var(--c2); opacity: .65; }
  .cf-bg i:nth-child(3) { width: 52vmax; height: 52vmax; left: 10vw; bottom: -26vmax; background: var(--c3); opacity: .9; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body { background: #0F1226; } :root:not([data-theme="light"]) .cf-bg i { opacity: .2; } }
  .cf-wrap { max-width: 600px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px calc(120px + env(safe-area-inset-bottom)); }
  .cf-top { display: flex; align-items: center; justify-content: space-between; min-height: 52px; }
  .cf-brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-weight: 700; font-size: 18px; min-height: 44px; }
  .cf-bar { display: flex; gap: 4px; margin-top: 10px; }
  .cf-bar i { flex: 1; height: 6px; border-radius: 6px; background: rgb(28 34 64 / .12); position: relative; overflow: hidden; }
  .cf-bar i::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--seg, #5b70b2); transform: scaleX(0); transform-origin: left; transition: transform 420ms cubic-bezier(.32,.72,0,1); }
  .cf-bar i.on::after { transform: scaleX(1); }
  .cf-meta { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; color: var(--muted); }
  .cf-pill { font: 700 11px/1 Manrope, sans-serif; letter-spacing: .06em; padding: 5px 10px; border-radius: 999px; color: rgb(var(--eg-c)); background: rgb(var(--eg-c) / .14); transition: color 420ms linear, background-color 420ms linear; }
  .cf-stage { position: relative; margin-top: 18px; }
  .cf-step { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
  .cf-step.in-next { animation: cfInNext 320ms cubic-bezier(.23,1,.32,1) both; }
  .cf-step.in-prev { animation: cfInPrev 320ms cubic-bezier(.23,1,.32,1) both; }
  .cf-step.out-next { position: absolute; inset: 0 0 auto; animation: cfOutNext 160ms cubic-bezier(.23,1,.32,1) both; pointer-events: none; }
  .cf-step.out-prev { position: absolute; inset: 0 0 auto; animation: cfOutPrev 160ms cubic-bezier(.23,1,.32,1) both; pointer-events: none; }
  @keyframes cfInNext { from { opacity: 0; transform: translateX(32px); filter: blur(6px); } }
  @keyframes cfInPrev { from { opacity: 0; transform: translateX(-32px); filter: blur(6px); } }
  @keyframes cfOutNext { to { opacity: 0; transform: translateX(-24px); } }
  @keyframes cfOutPrev { to { opacity: 0; transform: translateX(24px); } }
  .cf-step h1 { font-size: clamp(28px, 7vw, 36px); }
  .cf-step .lead { color: var(--muted); }
  .cf-card { padding: 20px; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  .cf-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .cf-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cf-label { font-size: 13px; font-weight: 600; }
  .cf-input { font: 500 16px Manrope, system-ui, sans-serif; color: var(--ink); width: 100%; min-height: 52px; padding: 0 16px; border-radius: 16px; border: 1px solid rgb(255 255 255 / .9);
    background: linear-gradient(135deg, rgb(255 255 255 / .85), rgb(255 255 255 / .6)); box-shadow: inset 0 1px 1px rgb(255 255 255 / .9), 0 4px 14px -8px rgb(var(--eg-c) / .25);
    transition: border-color 160ms linear, box-shadow 220ms cubic-bezier(.23,1,.32,1); }
  .cf-input:focus { outline: none; border-color: rgb(var(--eg-c) / .7); box-shadow: 0 0 0 3px rgb(var(--eg-c) / .16); }
  .cf-input[aria-invalid="true"] { border-color: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
  .cf-field { display: grid; gap: 6px; position: relative; }
  .cf-hint { font-size: 12px; font-weight: 600; color: var(--muted); min-height: 16px; }
  .cf-hint.ok { color: #1b653e; } .cf-hint.bad { color: var(--bad); }
  .cf-cep { position: relative; }
  .cf-cep .st { position: absolute; right: 14px; top: 50%; width: 20px; height: 20px; margin-top: -10px; }
  .cf-filled { animation: cfFill 600ms cubic-bezier(.23,1,.32,1); }
  @keyframes cfFill { 0% { background-color: rgb(var(--eg-c) / .18); } 100% { background-color: transparent; } }
  .cf-photo { display: flex; align-items: center; gap: 14px; }
  .cf-avatar { width: 72px; height: 72px; border-radius: 50%; border: 3px solid #fff; background: linear-gradient(135deg, #b8c4ff, #ffd3c2) center/cover; box-shadow: 0 8px 20px -8px rgb(var(--eg-c) / .4); flex: none; }
  .cf-day { display: grid; gap: 8px; }
  .cf-day[hidden] { display: none; }
  .cf-link { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 16px; border-radius: 18px; }
  .cf-link code { min-width: 0; font: 600 15px Manrope, sans-serif; color: rgb(var(--eg-c)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .cf-ok { border-radius: 18px; padding: 12px 14px; background: #dff4e8; color: #1b653e; font-weight: 600; font-size: 14px; }
  .cf-warn { border-radius: 18px; padding: 12px 14px; background: #f8edd3; color: #7d5112; font-weight: 600; font-size: 14px; }
  .cf-sum { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 12px; border-radius: 20px; }
  .cf-sum .dot { width: 40px; height: 40px; border-radius: 50%; background: rgb(var(--eg-c)); }
  .cf-sum b { display: block; } .cf-sum span { font-size: 13px; color: var(--muted); }
  /* Painel de configurações (quem já terminou o passo a passo). Cada linha abre só aquele item. */
  .cf-hub { display: grid; gap: 10px; }
  .cf-hubrow { appearance: none; display: grid; grid-template-columns: 12px 1fr auto 18px; gap: 12px; align-items: center; width: 100%; min-height: 64px; padding: 12px 14px; border-radius: 20px; text-align: left; font: inherit; color: var(--ink); cursor: pointer;
    transition: transform 120ms cubic-bezier(.23,1,.32,1), box-shadow 200ms cubic-bezier(.23,1,.32,1); animation: cfRow 360ms cubic-bezier(.23,1,.32,1) both; }
  .cf-hubrow:nth-child(2) { animation-delay: 40ms; } .cf-hubrow:nth-child(3) { animation-delay: 80ms; } .cf-hubrow:nth-child(4) { animation-delay: 120ms; } .cf-hubrow:nth-child(n+5) { animation-delay: 160ms; }
  @keyframes cfRow { from { opacity: 0; transform: translateY(8px); } }
  .cf-hubrow:active { transform: scale(.98); }
  .cf-hubrow:focus-visible { outline: 2px solid rgb(var(--eg-c)); outline-offset: 2px; }
  .cf-hubrow .dot { width: 12px; height: 12px; border-radius: 50%; background: rgb(var(--eg-c)); box-shadow: 0 0 0 4px rgb(var(--eg-c) / .14); }
  .cf-hubtxt { display: grid; gap: 2px; min-width: 0; }
  .cf-hubtxt b { font-size: 15px; }
  .cf-hubtxt span { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* No celular o resumo quebra em até duas linhas em vez de cortar com reticências (AR-16). */
  @media (max-width: 640px) { .cf-hubtxt span { white-space: normal; overflow: visible; text-overflow: clip; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; } .cf-hubtxt b { white-space: normal; overflow-wrap: anywhere; } }
  .cf-hubst { font: 700 12px/1 Manrope, sans-serif; padding: 6px 10px; border-radius: 999px; color: rgb(var(--eg-c)); background: rgb(var(--eg-c) / .12); }
  .cf-hubst.ok { color: #1F7A4D; background: rgb(31 122 77 / .12); }
  .cf-hubst.todo { color: #A86A00; background: rgb(168 106 0 / .12); }
  .cf-hubgo { width: 18px; height: 18px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform 200ms cubic-bezier(.23,1,.32,1); }
  @media (hover: hover) { .cf-hubrow:hover .cf-hubgo { transform: translateX(3px); } }
  .cf-hubrow.is-saved { animation: cfSaved 1.2s cubic-bezier(.23,1,.32,1); }
  @keyframes cfSaved { 0% { box-shadow: 0 0 0 0 rgb(31 122 77 / .45); } 40% { box-shadow: 0 0 0 6px rgb(31 122 77 / .18); } 100% { box-shadow: 0 0 0 0 rgb(31 122 77 / 0); } }
  @media (prefers-reduced-motion: reduce) { .cf-hubrow, .cf-hubrow.is-saved { animation: none; } }
  .cf-list { display: grid; gap: 8px; }
  .cf-list .cf-x::before { content: ""; position: absolute; inset: -6px; }
  .cf-step .eg-btn { max-width: 100%; white-space: normal; text-align: center; }
  .cf-list div { display: flex; justify-content: space-between; gap: 8px; padding: 10px 14px; border-radius: 14px; background: rgb(255 255 255 / .55); font-weight: 600; font-size: 14px; }
  .cf-dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); width: min(568px, calc(100vw - 32px)); padding: 12px; border-radius: 34px; display: flex; gap: 12px; z-index: 10; }
  .cf-dock .eg-btn:last-child { flex: 1; }
  .cf-dock .eg-btn[hidden] { display: none; }
  .cf-dock #dock-slide { flex: 1; height: 54px; }
  .cf-dock #dock-slide[hidden] { display: none; }
  .cf-dock #dock-slide .es-knob { width: 50px; height: 44px; }
  .cf-skip { background: none; border: 0; color: var(--muted); font: 600 14px Manrope, sans-serif; min-height: 44px; padding: 0 12px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .cf-skel { height: 320px; border-radius: 28px; }
  /* Fundo vivo: as manchas de cor derivam devagar (desligado com movimento reduzido). */
  .cf-bg i:nth-child(1) { animation: cfDrift1 26s ease-in-out infinite alternate; }
  .cf-bg i:nth-child(2) { animation: cfDrift2 32s ease-in-out infinite alternate; }
  .cf-bg i:nth-child(3) { animation: cfDrift3 38s ease-in-out infinite alternate; }
  @keyframes cfDrift1 { to { transform: translate(8vmax, 6vmax) scale(1.08); } }
  @keyframes cfDrift2 { to { transform: translate(-10vmax, 8vmax) scale(.94); } }
  @keyframes cfDrift3 { to { transform: translate(6vmax, -8vmax) scale(1.06); } }
  .cf-dayall { appearance: none; display: flex; align-items: baseline; gap: 10px; min-height: 44px; padding: 0 4px; border: 0; background: none; cursor: pointer; color: var(--ink); font: inherit; text-align: left; border-radius: 12px; align-items: center; }
  .cf-dayall b { font-size: 15px; }
  .cf-dayall span { font-size: 12px; font-weight: 600; color: var(--muted); transition: color 160ms linear; }
  .cf-dayall[aria-pressed="true"] span { color: rgb(var(--eg-c)); }
  .cf-dayall:focus-visible { outline: 2px solid rgb(var(--eg-c)); outline-offset: 2px; }
  .cf-blocks { display: grid; gap: 12px; padding-top: 16px; border-top: 1px solid rgb(var(--eg-c) / .14); }
  .cf-blocks-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .cf-blocks-head .eg-btn[hidden] { display: none; }
  .cf-bnew { display: grid; gap: 12px; padding: 14px; border-radius: 22px; background: rgb(255 255 255 / .5); border: 1px solid rgb(255 255 255 / .9); }
  .cf-bnew[hidden] { display: none; }
  .cf-bchips { display: flex; flex-wrap: wrap; gap: 6px; }
  .cf-bchips:empty { display: none; }
  .cf-bchip { padding: 6px 12px; border-radius: 999px; background: rgb(var(--eg-c, 59 79 184) / .12); color: var(--eg-ink, #202d50); font-size: 13px; font-weight: 600; }
  .cf-list .cf-x { appearance: none; width: 32px; height: 32px; margin: -6px -8px -6px 0; position: relative; border-radius: 50%; border: 0; background: rgb(var(--eg-c) / .08); color: var(--muted); font: 600 18px/1 Manrope, sans-serif; cursor: pointer; flex: none; transition: background-color 160ms linear, transform 100ms cubic-bezier(.23,1,.32,1); }
  .cf-list .cf-x:hover { background: rgb(var(--eg-c) / .16); }
  .cf-list .cf-x:active { transform: scale(.9); }
  .cf-list div { align-items: center; }
  .cf-crop { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgb(20 26 52 / .32); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .cf-crop-panel { width: min(400px, 100%); padding: 20px; display: grid; gap: 14px; }
  .cf-crop-stage { position: relative; width: min(280px, 100%); aspect-ratio: 1; margin: 0 auto; overflow: hidden; border-radius: 24px; background: #1c2240; touch-action: none; cursor: grab; }
  .cf-crop-stage:active { cursor: grabbing; }
  .cf-crop-stage img { position: absolute; left: 50%; top: 50%; max-width: none; user-select: none; -webkit-user-select: none; pointer-events: none; }
  .cf-crop-ring { position: absolute; inset: 8px; border-radius: 50%; box-shadow: 0 0 0 999px rgb(16 20 40 / .55), inset 0 0 0 2px rgb(255 255 255 / .9); pointer-events: none; }
  .cf-zoom { display: grid; grid-template-columns: 20px 1fr 20px; align-items: center; gap: 8px; color: var(--muted); font-weight: 700; text-align: center; }
  .cf-zoom input { -webkit-appearance: none; appearance: none; height: 6px; border-radius: 6px; background: rgb(var(--eg-c) / .18); outline: none; }
  .cf-zoom input::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(180deg, rgb(255 255 255 / .9), rgb(255 255 255 / .6)), rgb(var(--eg-c)); border: 1px solid rgb(255 255 255 / .9); box-shadow: 0 4px 12px -4px rgb(var(--eg-c) / .6); cursor: pointer; }
  .cf-zoom input::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 1px solid rgb(var(--eg-c) / .4); box-shadow: 0 4px 12px -4px rgb(var(--eg-c) / .6); cursor: pointer; }
  .cf-zoom input:focus-visible::-webkit-slider-thumb { outline: 2px solid rgb(var(--eg-c)); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .cf-bg i { animation: none !important; } }
  @media (prefers-reduced-motion: reduce) { .cf-step.in-next, .cf-step.in-prev { animation: plFade 120ms both; } .cf-step.out-next, .cf-step.out-prev { display: none; } }
</style>
<link rel="stylesheet" href="/eno-perf.css"></head>
<body data-produto="enomera">
<div class="cf-bg" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="cf-wrap">
  <header class="cf-top"><a class="cf-brand" href="/portal"><img src="/assets/brand.svg" width="32" height="27" alt="">enomera</a><a class="cf-skip" href="/portal" id="later">Terminar depois</a></header>
  <div class="cf-bar" id="bar" aria-hidden="true"></div>
  <div class="cf-meta"><span class="cf-pill" id="pill">ENOMERA</span><span id="count"></span></div>
  <main class="cf-stage" id="stage" aria-live="polite"><div class="cf-skel eg-surface" role="status" aria-busy="true"><span class="eno-sr-only">Carregando sua configuração</span></div></main>
</div>
<nav class="cf-dock eg-surface" id="dock" aria-label="Avançar ou voltar"><button type="button" class="eg-btn is-glass" id="back">Voltar</button><button type="button" class="eg-btn" id="next">Continuar</button></nav>
<script src="/configurar.js" type="module"></script>
<script src="/piloto/uso.js" data-produto="enomera" defer></script>
</body>
</html>
