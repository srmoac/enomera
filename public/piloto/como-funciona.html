<!doctype html>
<html lang="pt-BR" data-theme="light">
<head><script src="/eno-perf.js"></script>
<meta charset="UTF-8"><meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F0F4FE">
<title>Como funciona | Enomera</title>
<link rel="icon" type="image/svg+xml" href="/assets/brand.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/motion-tokens.css">
<link rel="stylesheet" href="/glass/liquid-glass.css">
<link rel="stylesheet" href="/piloto/piloto.css">
<style>
  :root { --c: 59 79 184; }
  body[data-step="1"] { --c: 83 69 154; }
  body[data-step="2"] { --c: 35 93 148; }
  body[data-step="3"] { --c: 30 98 94; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body { --c: 154 168 240; } :root:not([data-theme="light"]) body[data-step="1"] { --c: 180 168 245; } :root:not([data-theme="light"]) body[data-step="2"] { --c: 130 185 240; } :root:not([data-theme="light"]) body[data-step="3"] { --c: 120 210 200; } }
  .tr-wrap { max-width: 560px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); min-height: 100dvh; display: grid; grid-template-rows: auto 1fr; }
  .tr-top { display: flex; align-items: center; justify-content: space-between; min-height: 56px; }
  .tr-brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-weight: 700; font-size: 18px; min-height: 44px; }
  .tr-skip { color: var(--muted); }
  .tr-main { display: grid; align-content: center; padding: 12px 0 8px; }
  .tr-card { border-radius: 30px; padding: 24px 22px 20px; display: grid; gap: 20px; overflow: hidden; }
  @media (min-width: 600px) { .tr-card { padding: 32px 32px 24px; } }
  .tr-glow { position: fixed; z-index: -1; width: 70vmax; height: 70vmax; left: 50%; top: 40%; translate: -50% -50%; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgb(var(--c) / .22), transparent 62%); transition: background 420ms linear; }
  .tr-viewport { position: relative; min-width: 0; }
  .tr-card > * { min-width: 0; }
  .tr-slide { display: grid; gap: 16px; min-width: 0; }
  .tr-slide > * { min-width: 0; }
  .tr-slide.in-next { animation: trInNext 320ms var(--eno-ease-out) both; }
  .tr-slide.in-prev { animation: trInPrev 320ms var(--eno-ease-out) both; }
  .tr-slide.out-next { position: absolute; inset: 0 0 auto; animation: trOutNext 160ms var(--eno-ease-out) both; }
  .tr-slide.out-prev { position: absolute; inset: 0 0 auto; animation: trOutPrev 160ms var(--eno-ease-out) both; }
  @keyframes trInNext { from { opacity: 0; transform: translateX(28px); filter: blur(6px); } }
  @keyframes trInPrev { from { opacity: 0; transform: translateX(-28px); filter: blur(6px); } }
  @keyframes trOutNext { to { opacity: 0; transform: translateX(-20px); } }
  @keyframes trOutPrev { to { opacity: 0; transform: translateX(20px); } }
  .tr-eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: rgb(var(--c)); transition: color 320ms linear; }
  .tr-slide h1 { font-size: clamp(26px, 6.4vw, 36px); }
  .tr-slide p.lead { color: var(--muted); font-size: 16px; }
  /* Ilustrações (vidro, sem imagens externas) */
  /* Vidro dentro de vidro ficava cinza (§16): a ilustração usa só a tinta clara do produto. */
  .tr-art { background: linear-gradient(135deg, rgb(var(--c) / .10), rgb(255 255 255 / .72) 60%, rgb(var(--c) / .06)); border: 1px solid rgb(255 255 255 / .9); box-shadow: inset 0 1px 0 #fff; transition: background 420ms linear; border-radius: 22px; padding: 16px; min-height: 176px; display: grid; align-content: center; gap: 10px; position: relative; }
  .tr-hub { display: grid; grid-template-columns: 1fr auto 1fr; grid-template-rows: auto auto auto; align-items: center; justify-items: center; gap: 10px 6px; padding: 6px 0; }
  .tr-node { border-radius: 16px; padding: 10px 12px; font: 650 14px/1.2 Manrope, sans-serif; text-align: center; min-width: 92px; box-shadow: 0 6px 18px -8px rgb(28 34 64 / .3); }
  .tr-node small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
  .tr-node.hub { grid-column: 2; grid-row: 2; background: #3B4FB8; color: #fff; display: inline-flex; gap: 8px; align-items: center; }
  .tr-node.hub img { filter: brightness(0) invert(1); }
  .tr-node.etha { grid-column: 1 / 4; grid-row: 1; background: rgb(240 236 254 / .95); color: #3D2F86; }
  .tr-node.ambo { grid-column: 1; grid-row: 3; background: rgb(232 244 254 / .95); color: #1B4C7C; }
  .tr-node.minne { grid-column: 3; grid-row: 3; background: rgb(232 247 245 / .95); color: #17504C; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tr-node.etha, :root:not([data-theme="light"]) .tr-node.ambo, :root:not([data-theme="light"]) .tr-node.minne { filter: brightness(.92); } }
  .tr-hub .ln { grid-row: 2; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, rgb(59 79 184 / .4), transparent); }
  .tr-hub .ln.l { grid-column: 1; } .tr-hub .ln.r { grid-column: 3; }
  .tr-browser { background: rgb(255 255 255 / .9); border-radius: 14px; overflow: hidden; box-shadow: 0 8px 22px -10px rgb(28 34 64 / .35); color: #1C2240; }
  .tr-browser .bar { display: flex; gap: 6px; align-items: center; padding: 8px 10px; background: rgb(83 69 154 / .08); font-size: 12px; color: #56607F; }
  .tr-browser .bar i { width: 8px; height: 8px; border-radius: 50%; background: rgb(83 69 154 / .3); }
  .tr-browser .bar span { margin-left: 6px; background: #fff; border-radius: 999px; padding: 3px 10px; }
  .tr-browser .body { padding: 14px; display: grid; gap: 8px; }
  .tr-line { height: 9px; border-radius: 5px; background: rgb(83 69 154 / .16); }
  .tr-btn { justify-self: start; font: 650 12px/1 Manrope, sans-serif; padding: 8px 12px; border-radius: 999px; background: #5345A0; color: #fff; }
  .tr-week { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .tr-day { background: rgb(255 255 255 / .9); border-radius: 12px; padding: 8px 4px; text-align: center; font: 600 12px/1.2 Manrope, sans-serif; color: #1B4C7C; display: grid; gap: 4px; }
  .tr-day b { font-size: 11px; color: #56607F; font-weight: 600; }
  .tr-day .s { border-radius: 8px; padding: 4px 0; background: rgb(35 93 148 / .12); }
  .tr-day .s.off { background: transparent; color: #8A93B2; text-decoration: line-through; }
  .tr-row { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; background: rgb(255 255 255 / .9); border-radius: 14px; padding: 8px 10px; font: 600 13px/1.25 Manrope, sans-serif; color: #17504C; }
  .tr-row .av { width: 30px; height: 30px; border-radius: 50%; background: rgb(30 98 94 / .15); display: grid; place-items: center; font-size: 12px; }
  .tr-row small { display: block; font-weight: 500; color: #56607F; }
  .tr-row .pill { font-size: 11px; padding: 4px 8px; border-radius: 999px; background: rgb(30 98 94 / .12); }
  .tr-row .pill.ok { background: #1F7A4D; color: #fff; }
  .tr-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: s; }
  .tr-steps li { display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: start; }
  .tr-steps li::before { counter-increment: s; content: counter(s); width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: #fff; background: rgb(var(--c)); }
  .tr-steps b { display: block; }
  .tr-steps span { color: var(--muted); font-size: 14px; }
  /* Rodapé: pontos + botões */
  .tr-foot { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 6px; }
  .tr-foot .tr-back { padding: 0 10px; }
  .tr-dots { display: flex; gap: 2px; justify-content: center; }
  .tr-dots button { appearance: none; border: 0; background: transparent; width: 20px; height: 44px; display: grid; place-items: center; cursor: pointer; padding: 0; }
  .tr-dots button i { width: 8px; height: 8px; border-radius: 8px; background: rgb(28 34 64 / .2); transition: width 220ms var(--eno-ease-move), background-color 220ms linear; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tr-dots button i { background: rgb(238 241 252 / .25); } }
  .tr-dots button[aria-current="step"] i { width: 22px; background: rgb(var(--c)); }
  .tr-dots button:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; border-radius: 10px; }
  .tr-next { background: rgb(var(--c)); transition: background-color 320ms linear, transform var(--eno-t-press) var(--eno-ease-out); min-width: 0; padding: 0 20px; }
  .tr-back[hidden] { visibility: hidden; display: inline-flex; }
  .tr-hint { text-align: center; font-size: 13px; color: var(--faint); margin-top: 12px; }
  @media (prefers-reduced-motion: reduce) {
    .tr-slide.in-next, .tr-slide.in-prev { animation: plFade 120ms both; }
    .tr-slide.out-next, .tr-slide.out-prev { display: none; }
  }
</style>
<link rel="stylesheet" href="/eno-perf.css"></head>
<body data-step="0">
<div class="pl-backdrop" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="tr-glow" aria-hidden="true"></div>
<div class="tr-wrap">
  <header class="tr-top"><a class="tr-brand" href="/"><img src="/assets/brand.svg" width="32" height="27" alt="">enomera</a><a class="pl-btn is-ghost tr-skip" id="skip" href="/checkout">Pular</a></header>
  <main class="tr-main">
    <section class="tr-card lg pl-in" data-glass="reading" data-glass-tint="enomera" aria-roledescription="passeio" aria-label="Como a Enomera funciona">
      <div class="tr-viewport" id="vp" aria-live="polite"></div>
      <div class="tr-foot">
        <button type="button" class="pl-btn is-ghost tr-back" id="back">Voltar</button>
        <nav class="tr-dots" id="dots" aria-label="Etapas do passeio"></nav>
        <button type="button" class="pl-btn tr-next" id="next">Próximo</button>
      </div>
    </section>
    <p class="tr-hint" id="hint">Arraste para o lado ou use as setas do teclado.</p>
  </main>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var NEXT = q.get('next') || '/checkout';
  if (!/^\/[^/]/.test(NEXT)) NEXT = '/checkout';
  var NOME = (q.get('nome') || '').slice(0, 40);
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var tints = ['enomera', 'etha', 'ambo', 'minne', 'enomera'];
  var STEPS = [
    { eyebrow: 'Piloto Enomera', title: (NOME ? 'Oi, ' + esc(NOME) + '. ' : '') + 'Uma conta, três serviços',
      lead: 'Com a conta Enomera você usa o site, o agendamento e a gestão do consultório. Eles conversam entre si: o que muda em um aparece no outro.',
      art: '<div class="tr-art"><div class="tr-hub">' +
        '<div class="tr-node etha">Site<small>seu site</small></div>' +
        '<span class="ln l"></span><div class="tr-node hub"><img src="/assets/brand.svg" width="20" height="17" alt="">Enomera</div><span class="ln r"></span>' +
        '<div class="tr-node ambo">Agendamento<small>o paciente marca</small></div><div class="tr-node minne">Consultório<small>pacientes e prontuário</small></div></div></div>' },
    { eyebrow: 'Enomera Site', title: 'Seu site profissional, feito por nós',
      lead: 'Você responde algumas perguntas e envia suas fotos. A gente monta o seu site no nosso modelo, com as suas informações. O botão de agendar já leva para o Agendamento.',
      art: '<div class="tr-art"><div class="tr-browser"><div class="bar"><i></i><i></i><i></i><span>etha · /seu-nome</span></div>' +
        '<div class="body"><div class="tr-line" style="width:46%"></div><div class="tr-line" style="width:82%;height:14px"></div><div class="tr-line" style="width:64%"></div><span class="tr-btn">Agendar consulta</span></div></div></div>' },
    { eyebrow: 'Enomera Agendamento', title: 'Você abre a agenda, o paciente pede o horário',
      lead: 'Primeiro você define dias, horários, valor e local de atendimento. Só depois o paciente consegue pedir uma consulta. Os pedidos chegam no próprio Agendamento, na aba Pedidos, e você confirma por lá. Dá para usar só o Agendamento.',
      art: '<div class="tr-art"><div class="tr-week">' +
        ['Seg', 'Ter', 'Qua', 'Qui', 'Sex'].map(function (d, i) { return '<div class="tr-day"><b>' + d + '</b><span class="s' + (i === 2 ? ' off' : '') + '">9h</span><span class="s' + (i === 4 ? ' off' : '') + '">14h</span><span class="s">18h</span></div>'; }).join('') +
        '</div></div>' },
    { eyebrow: 'Enomera Consultório', title: 'Pedidos, agenda e prontuário no mesmo lugar',
      lead: 'O Consultório é a gestão da sua prática: pacientes, agenda do dia e prontuário. Se você também tem o Agendamento, cada pedido confirmado vira paciente e entra na agenda do Consultório sozinho.',
      art: '<div class="tr-art" style="gap:8px">' +
        '<div class="tr-row"><span class="av">AO</span><span>Ana Oliveira<small>pediu ter., 14h</small></span><span class="pill">Novo</span></div>' +
        '<div class="tr-row"><span class="av">RS</span><span>Rafael Souza<small>qui., 18h · online</small></span><span class="pill ok">Confirmada</span></div></div>' },
    { eyebrow: 'Como testar', title: 'Tudo grátis no piloto. Por onde começar',
      lead: '',
      art: '<ol class="tr-steps"><li><div><b>Escolha os serviços</b><span>Todos os planos estão liberados, sem cartão e sem cobrança.</span></div></li>' +
        '<li><div><b>Configure seu atendimento</b><span>No Agendamento, libere seus horários antes de convidar alguém para agendar.</span></div></li>' +
        '<li><div><b>Use como no dia a dia e conte o que estranhou</b><span>O piloto registra como você usa as telas, nunca o que você escreve.</span></div></li></ol>' }
  ];
  var vp = document.getElementById('vp'), dots = document.getElementById('dots'), next = document.getElementById('next'), back = document.getElementById('back');
  var card = document.querySelector('.tr-card');
  document.getElementById('skip').href = NEXT;
  var i = 0, busy = false;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  dots.innerHTML = STEPS.map(function (s, k) { return '<button type="button" data-k="' + k + '" aria-label="Etapa ' + (k + 1) + ' de ' + STEPS.length + '"><i></i></button>'; }).join('');
  function slideHtml(k) { var s = STEPS[k]; return '<div class="tr-slide"><p class="tr-eyebrow">' + s.eyebrow + '</p><h1 tabindex="-1">' + s.title + '</h1>' + (s.lead ? '<p class="lead">' + s.lead + '</p>' : '') + s.art + '</div>'; }
  function paint() {
    document.body.setAttribute('data-step', String([0, 1, 2, 3, 0][i]));
    card.setAttribute('data-glass-tint', tints[i]);
    dots.querySelectorAll('button').forEach(function (b, k) { if (k === i) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current'); });
    back.hidden = i === 0;
    next.textContent = i === STEPS.length - 1 ? 'Escolher serviços' : 'Próximo';
  }
  function go(k, focus) {
    if (k < 0 || k >= STEPS.length || k === i || busy) return;
    var dir = k > i ? 'next' : 'prev';
    var old = vp.firstElementChild;
    var h0 = vp.offsetHeight;
    i = k;
    var tmp = document.createElement('div'); tmp.innerHTML = slideHtml(k); var nu = tmp.firstElementChild;
    if (reduce || !old) { vp.innerHTML = ''; vp.appendChild(nu); nu.classList.add('in-' + dir); paint(); if (focus) nu.querySelector('h1').focus({ preventScroll: true }); return; }
    busy = true;
    old.classList.add('out-' + dir);
    vp.appendChild(nu); nu.classList.add('in-' + dir);
    var h1 = nu.offsetHeight;
    if (vp.animate && Math.abs(h1 - h0) > 1) vp.animate([{ height: h0 + 'px' }, { height: h1 + 'px' }], { duration: 320, easing: 'cubic-bezier(.32,.72,0,1)' });
    paint();
    setTimeout(function () { old.remove(); busy = false; }, 170);
    if (focus) nu.querySelector('h1').focus({ preventScroll: true });
  }
  next.onclick = function () { if (i === STEPS.length - 1) { done(); return; } go(i + 1, true); };
  back.onclick = function () { go(i - 1, true); };
  dots.onclick = function (e) { var b = e.target.closest('[data-k]'); if (b) go(Number(b.getAttribute('data-k')), true); };
  function done() {
    try { localStorage.setItem('eno_tour_visto', '1'); } catch (e) {}
    next.setAttribute('aria-busy', 'true');
    card.classList.add('pl-out');
    setTimeout(function () { location.href = NEXT; }, reduce ? 0 : 170);
  }
  document.getElementById('skip').addEventListener('click', function () { try { localStorage.setItem('eno_tour_visto', '1'); } catch (e) {} });
  addEventListener('keydown', function (e) {
    if (e.target.closest && e.target.closest('input,textarea')) return;
    if (e.key === 'ArrowRight') go(i + 1, false); else if (e.key === 'ArrowLeft') go(i - 1, false);
  });
  var sx = 0, sy = 0, tracking = false;
  vp.addEventListener('pointerdown', function (e) { tracking = true; sx = e.clientX; sy = e.clientY; });
  addEventListener('pointerup', function (e) { if (!tracking) return; tracking = false; var dx = e.clientX - sx, dy = e.clientY - sy; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) go(i + (dx < 0 ? 1 : -1), false); });
  if (!matchMedia('(pointer: coarse)').matches) document.getElementById('hint').textContent = 'Use as setas do teclado para avançar.';
  else document.getElementById('hint').textContent = 'Arraste para o lado para avançar.';
  vp.innerHTML = slideHtml(0); paint();
})();
</script>
<script type="module" src="/glass/liquid-glass-auto.js"></script>
