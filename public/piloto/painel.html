<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F0F4FE">
<meta name="color-scheme" content="light only">
<title>Painel do piloto | Enomera</title>
<link rel="icon" type="image/svg+xml" href="/assets/brand.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/motion-tokens.css">
<link rel="stylesheet" href="/glass/liquid-glass.css">
<link rel="stylesheet" href="/piloto/piloto.css">
<link rel="stylesheet" href="/piloto/painel.css">
</head>
<body>
<div class="pl-backdrop" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="pn-top lg" data-glass="regular" data-glass-tint="enomera">
  <a class="pn-brand" href="/"><img src="/assets/brand.svg" width="28" height="24" alt="">enomera <span>piloto</span></a>
  <nav class="pn-nav" aria-label="Seções do painel" id="pn-nav" hidden>
    <span class="pn-tab-lens" aria-hidden="true"></span>
    <a href="#dia" data-view="dia">Resumo do dia</a><a href="#uso" data-view="uso">Convidados e uso</a><a href="#sob" data-view="sob">Sob medida<span class="pn-badge" hidden></span></a><a href="#convites" data-view="convites">Convites</a><a href="#erros" data-view="erros">Erros<span class="pn-badge" hidden></span></a>
  </nav>
  <div class="pn-tools" id="pn-tools" hidden>
    <div class="pl-seg" role="group" aria-label="Período" id="pn-period"><span class="pl-lens" aria-hidden="true"></span><button type="button" data-dias="7" aria-pressed="false">7 dias</button><button type="button" data-dias="14" aria-pressed="true">14 dias</button><button type="button" data-dias="30" aria-pressed="false">30 dias</button></div>
    <button type="button" class="pl-btn is-ghost" id="pn-teste" aria-pressed="false" title="Mostrar também a sua conta de teste">Meu teste</button>
    <button type="button" class="pl-btn is-quiet" id="pn-refresh" aria-label="Atualizar agora">Atualizar</button>
  </div>
</header>
<main id="pn" class="pn-main" aria-live="polite"></main>
<div class="pn-tip" id="pn-tip" role="tooltip" hidden></div>
<div class="pn-scrim" id="pn-scrim" hidden></div>
<aside class="pn-drawer lg" data-glass="reading" data-glass-tint="enomera" id="pn-drawer" role="dialog" aria-modal="true" aria-labelledby="pn-drawer-title" hidden></aside>
<script src="/piloto/painel.js" defer></script>
<script type="module" src="/glass/liquid-glass-auto.js"></script>
</body>
</html>
