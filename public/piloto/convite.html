<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F0F4FE">
<title>Convite para o piloto | Enomera</title>
<link rel="icon" type="image/svg+xml" href="/assets/brand.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/motion-tokens.css">
<link rel="stylesheet" href="/glass/liquid-glass.css">
<link rel="stylesheet" href="/piloto/piloto.css">
<link rel="stylesheet" href="/eno-feedback.css">
<script src="/eno-feedback.js"></script>
<link rel="stylesheet" href="/eno-slide.css">
<script src="/eno-slide.js"></script>
<style>
  .cv-wrap { max-width: 560px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px 48px; }
  .cv-top { display: flex; align-items: center; justify-content: space-between; min-height: 56px; }
  .cv-brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-weight: 700; font-size: 18px; min-height: 44px; }
  .cv-card { border-radius: 28px; padding: 28px 22px; margin-top: 12px; display: grid; gap: 22px; }
  @media (min-width: 600px) { .cv-card { padding: 36px 36px; } }
  .cv-eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
  .cv-form { display: grid; gap: 18px; }
  .cv-slide { --eg-c: 59 79 184; }
  .cv-agree { font-size: 14px; color: var(--ink); margin: 0; }
  .cv-two { display: grid; gap: 18px; }
  @media (min-width: 600px) { .cv-two { grid-template-columns: 1fr 1fr; } }
  .cv-consent { border-radius: 18px; padding: 18px; background: var(--accent-soft); display: grid; gap: 12px; }
  .cv-consent ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; color: var(--ink); }
  .cv-consent .no { color: var(--muted); }
  .cv-done { text-align: center; display: grid; gap: 14px; justify-items: center; padding: 12px 0; }
  .cv-done svg { width: 64px; height: 64px; }
  .cv-done circle { stroke: var(--accent); stroke-width: 3; fill: none; stroke-dasharray: 190; stroke-dashoffset: 190; animation: cvDraw 420ms var(--eno-ease-out) forwards; }
  .cv-done path { stroke: var(--accent); stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; animation: cvDraw 320ms 220ms var(--eno-ease-out) forwards; }
  @keyframes cvDraw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { .cv-done circle, .cv-done path { animation: none; stroke-dashoffset: 0; } }
  .cv-skel { height: 220px; border-radius: 28px; }
</style>
</head>
<body>
<div class="pl-backdrop" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="cv-wrap">
  <header class="cv-top"><a class="cv-brand" href="/"><img src="/assets/brand.svg" width="32" height="27" alt="">enomera</a><span class="muted small">Piloto fechado</span></header>
  <main id="cv" aria-live="polite"><div class="cv-skel lg" data-glass="regular" data-glass-tint="enomera" role="status" aria-busy="true"><span class="eno-sr-only">Abrindo convite</span></div></main>
</div>
<script>
(function () {
  var TOKEN = decodeURIComponent((location.pathname.split('/convite/')[1] || '').split('/')[0] || new URLSearchParams(location.search).get('t') || '');
  var root = document.getElementById('cv');
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  function swap(html) {
    var old = root.firstElementChild;
    var mount = function () { root.innerHTML = html; var f = root.querySelector('[data-autofocus]'); if (f) setTimeout(function () { f.focus({ preventScroll: true }); }, 60); wire(); };
    if (old && !matchMedia('(prefers-reduced-motion: reduce)').matches) { old.classList.add('pl-out'); setTimeout(mount, 200); } else mount();
  }
  function card(inner) { return '<section class="cv-card lg pl-in" data-glass="reading" data-glass-tint="enomera">' + inner + '</section>'; }
  function msg(title, text, cta) { return card('<div class="pl-stagger" style="display:grid;gap:14px"><p class="cv-eyebrow">Convite</p><h1>' + title + '</h1><p class="muted">' + text + '</p>' + (cta || '') + '</div>'); }

  var KIND = 'tester';
  function formHtml() {
    var admin = KIND === 'admin';
    return card(
      '<div class="pl-stagger" style="display:grid;gap:10px">' +
        '<p class="cv-eyebrow">' + (admin ? 'Acesso de administrador' : 'Você foi convidado para o piloto') + '</p>' +
        '<h1>' + (admin ? 'Seu painel do piloto' : 'Teste a Enomera de verdade') + '</h1>' +
        '<p class="muted">' + (admin ? 'Crie o acesso que abre o painel com o uso de cada convidado. Este link funciona uma única vez.' : 'Crie sua conta e use o site, a agenda e a gestão como usaria no seu consultório. No piloto tudo é gratuito: todos os planos, combos e serviços, sem cartão e sem cobrança. Este link é seu e funciona uma única vez.') + '</p>' +
      '</div>' +
      '<form class="cv-form pl-stagger" novalidate>' +
        '<div class="pl-field"><label for="f-name">' + (admin ? 'Seu nome' : 'Nome profissional') + '</label><input id="f-name" name="fullName" autocomplete="name" data-autofocus aria-describedby="e-name"><p class="pl-err" id="e-name"></p></div>' +
        '<div class="pl-field"><label for="f-email">E-mail</label><input id="f-email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" aria-describedby="e-email"><p class="pl-err" id="e-email"></p></div>' +
        '<div class="pl-field"><label for="f-pass">Senha</label><div class="pl-pass"><input id="f-pass" name="password" type="password" autocomplete="new-password" aria-describedby="h-pass e-pass"><button type="button" class="pl-btn is-ghost" data-toggle-pass aria-pressed="false">Mostrar</button></div><p class="hint" id="h-pass" hidden>Ao menos 8 caracteres.</p><p class="pl-err" id="e-pass"></p></div>' +
        (admin ? '' :
        '<div class="cv-two"><div class="pl-field"><label for="f-crp">CRP ou CRM <span class="muted">(opcional)</span></label><input id="f-crp" name="crpOrCrm" autocomplete="off"></div>' +
        '<div class="pl-field"><span id="l-spec" style="font-size:14px;font-weight:600">Área</span><div class="pl-seg" role="group" aria-labelledby="l-spec"><span class="pl-lens" aria-hidden="true"></span><button type="button" data-spec="Psicologia" aria-pressed="true">Psicologia</button><button type="button" data-spec="Psiquiatria" aria-pressed="false">Psiquiatria</button></div></div></div>') +
        (admin ?
        '<div class="cv-consent"><p class="small"><b>Seu uso não entra nas contas.</b> O painel mostra só o uso dos convidados. Com este acesso você também cria e cancela convites.</p></div>' :
        '<div class="cv-consent" id="consent-box"><h3>O que o piloto registra enquanto você usa</h3><ul>' +
          '<li>Quais telas você abre, por quanto tempo e quando volta.</li>' +
          '<li>Onde você toca ou clica (posição na tela e nome do botão).</li>' +
          '<li>Erros que aparecerem e chamadas que falharem, para corrigirmos.</li>' +
          '<li class="no">Nunca o que você escreve: prontuário, nomes de pacientes, mensagens e valores de campos ficam fora.</li>' +
        '</ul><p class="small muted">Serve só para melhorar os produtos durante o piloto. Só o Marcos vê. Você pode sair quando quiser. Detalhes nos <a href="/termos#piloto" target="_blank" rel="noopener">Termos</a> e na <a href="/privacidade#piloto" target="_blank" rel="noopener">Privacidade</a>.</p>' +
        '<p class="cv-agree"><b>Ao deslizar abaixo, você concorda em participar do piloto</b> e com o registro de uso descrito acima.</p></div>') +
        '<p class="pl-err" id="e-form" role="alert"></p>' +
        (admin ? '<button class="pl-btn" type="submit" data-submit>Criar acesso e abrir o painel</button>' : '<div class="cv-slide" data-slide></div>') +
      '</form>');
  }
  function placeLens() {
    var seg = root.querySelector('.pl-seg'); if (!seg) return;
    var on = seg.querySelector('[aria-pressed="true"]'); var lens = seg.querySelector('.pl-lens');
    lens.style.width = on.offsetWidth + 'px'; lens.style.transform = 'translateX(' + on.offsetLeft + 'px)';
  }
  function wire() {
    var f = root.querySelector('form'); if (!f) return;
    placeLens(); addEventListener('resize', placeLens);
    root.querySelectorAll('[data-spec]').forEach(function (b) { b.onclick = function () { root.querySelectorAll('[data-spec]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); placeLens(); }; });
    var tp = root.querySelector('[data-toggle-pass]');
    tp.onclick = function () { var i = root.querySelector('#f-pass'); var show = i.type === 'password'; i.type = show ? 'text' : 'password'; tp.textContent = show ? 'Ocultar' : 'Mostrar'; tp.classList.remove('is-swap'); void tp.offsetWidth; tp.classList.add('is-swap'); i.focus({ preventScroll: true }); tp.setAttribute('aria-pressed', String(show)); };
    f.addEventListener('input', function (e) { var el = e.target; if (el.getAttribute('aria-invalid') === 'true') { el.removeAttribute('aria-invalid'); var er = document.getElementById('e-' + ({ fullName: 'name', email: 'email', password: 'pass', consent: 'consent' }[el.name])); if (er) er.textContent = ''; } });
    var pi = root.querySelector('#f-pass');
    if (window.EnoFeedback) EnoFeedback.password(pi, { userInputs: function () { return [f.fullName.value, f.email.value]; }, after: pi.parentElement });
    f.addEventListener('submit', submit);
    var slot = root.querySelector('[data-slide]');
    if (slot && window.EnoSlide) EnoSlide.mount(slot, { label: 'Deslize para concordar', busyLabel: 'Criando sua conta…', doneLabel: 'Conta criada', onConfirm: function () { return send(f); } });
    else if (slot) slot.outerHTML = '<button class="pl-btn" type="submit" data-submit>Concordar e criar conta</button>';
  }
  function fail(id, input, text) { document.getElementById(id).textContent = text; if (input) input.setAttribute('aria-invalid', 'true'); return input; }
  function validate(f) {
    ['e-name', 'e-email', 'e-pass', 'e-form'].forEach(function (id) { var el = document.getElementById(id); if (el) el.textContent = ''; });
    var name = f.fullName.value.trim(); var email = f.email.value.trim(); var pass = f.password.value;
    var first = null;
    if (name.length < 2) first = first || fail('e-name', f.fullName, 'Escreva seu nome.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) first = first || fail('e-email', f.email, 'Confira o e-mail. Ele precisa ter @ e domínio.');
    var pw = f.password.__enoPw ? f.password.__enoPw.check() : { valid: pass.length >= 8, rules: { len: pass.length >= 8, own: true } };
    if (!pw.valid) first = first || fail('e-pass', f.password, !pw.rules.len ? 'Use ao menos 8 caracteres.' : 'Escolha uma senha que não seja seu nome, e-mail ou uma sequência comum.');
    if (first) { first.focus(); return false; }
    return true;
  }
  // Envia o cadastro. Promessa com true quando a conta foi criada (o deslizar mostra o ✓), false quando não.
  function send(f) {
    if (!validate(f)) return Promise.resolve(false);
    var name = f.fullName.value.trim();
    var spec = root.querySelector('[data-spec][aria-pressed="true"]');
    return fetch('/api/v1/pilot/invites/' + encodeURIComponent(TOKEN) + '/accept', {
      method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fullName: name, email: f.email.value.trim(), password: f.password.value, crpOrCrm: f.crpOrCrm ? f.crpOrCrm.value.trim() : '', specialty: spec ? spec.getAttribute('data-spec') : 'Psicologia', consent: true })
    }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, status: r.status, d: d }; }); }).then(function (res) {
      if (!res.ok) {
        if (res.d.code === 'EMAIL_EXISTS') { fail('e-email', f.email, res.d.error).focus(); return false; }
        if (res.d.code === 'INVITE_USED') { swap(msg('Convite já usado', 'Esta conta já foi criada. Entre com o e-mail e a senha que você cadastrou.', '<a class="pl-btn" href="/conta">Entrar</a>')); return false; }
        document.getElementById('e-form').textContent = (res.d.error || 'Não deu certo agora.') + ' Nada foi criado; tente de novo.';
        return false;
      }
      try { sessionStorage.setItem('enomera_session_token_v1', res.d.sessionToken); if (KIND === 'admin') localStorage.setItem('eno_uso_off', '1'); else localStorage.setItem('eno_piloto_gratis', '1'); } catch (err) {}
      setTimeout(function () {
        swap(card('<div class="cv-done"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29"/><path d="M20 33l8 8 16-17"/></svg><h1>' + (KIND === 'admin' ? 'Acesso criado' : 'Conta criada') + '</h1><p class="muted">' + (KIND === 'admin' ? 'Abrindo o painel do piloto.' : 'Antes de começar, um passeio rápido de como os serviços funcionam.') + '</p></div>'));
        setTimeout(function () { var nx = res.d.next || '/checkout'; location.href = KIND === 'admin' ? nx : '/piloto/como-funciona?nome=' + encodeURIComponent(name.split(' ')[0]) + '&next=' + encodeURIComponent(nx); }, 1300);
      }, KIND === 'admin' ? 0 : 650);
      return true;
    }).catch(function () {
      document.getElementById('e-form').textContent = 'Sem conexão com a Enomera agora. Nada foi enviado; confira a internet e tente de novo.';
      return false;
    });
  }
  function submit(e) {
    e.preventDefault(); var f = e.target;
    var btn = f.querySelector('[data-submit]');
    if (!btn) { if (validate(f)) { var k = f.querySelector('.es-knob'); if (k) k.focus(); } return; }
    if (btn.getAttribute('aria-busy') === 'true') return;
    btn.setAttribute('aria-busy', 'true'); var label = btn.textContent; var slow = setTimeout(function () { btn.innerHTML = '<span class="pl-spin" aria-hidden="true"></span>Criando'; }, 300);
    send(f).then(function (ok) { clearTimeout(slow); if (!ok) { btn.removeAttribute('aria-busy'); btn.textContent = label; } });
  }
  if (!TOKEN) { swap(msg('Link incompleto', 'Abra o link exatamente como você recebeu. Se não funcionar, peça outro ao Marcos.')); return; }
  fetch('/api/v1/pilot/invites/' + encodeURIComponent(TOKEN), { credentials: 'same-origin' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      KIND = d.kind || 'tester';
      if (d.state === 'open') swap(formHtml());
      else if (d.state === 'used') swap(msg('Este convite já foi usado', 'A conta deste convite já existe. Entre com o e-mail e a senha cadastrados.', '<a class="pl-btn" href="' + (KIND === 'admin' ? '/piloto/painel' : '/conta') + '">Entrar</a>'));
      else swap(msg('Convite indisponível', 'Este link não vale mais. Peça um novo ao Marcos.'));
    })
    .catch(function () { swap(msg('Sem conexão', 'Não conseguimos abrir o convite agora. Confira a internet e recarregue a página.', '<button class="pl-btn" type="button" onclick="location.reload()">Tentar de novo</button>')); });
})();
</script>
<script type="module" src="/glass/liquid-glass-auto.js"></script>
<script src="/piloto/uso.js" data-produto="enomera" defer></script>
</body>
</html>
